<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaBulletin — Hors ligne</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f8fafc;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 1.5rem;
      color: #1f2937;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
    }
    .icon {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #1E2A78, #0F1A52);
      border-radius: 20px;
      margin: 0 auto 1.5rem;
      display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 1.35rem; font-weight: 800; margin-bottom: 0.5rem; }
    p  { font-size: 0.9rem; color: #6b7280; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: linear-gradient(135deg, #1E2A78, #3b4fd8);
      color: #fff; border: none; border-radius: 12px;
      padding: 0.75rem 2rem; font-size: 0.9rem; font-weight: 700;
      cursor: pointer; width: 100%;
      font-family: inherit;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 192 192">
        <g transform="translate(96 96)">
          <path d="M 0 -60 C 5 -26, 26 -5, 60 0 C 26 5, 5 26, 0 60 C -5 26, -26 5, -60 0 C -26 -5, -5 -26, 0 -60 Z" fill="#FFB547"/>
        </g>
      </svg>
    </div>
    <h1>Pas de connexion</h1>
    <p>Vous êtes hors ligne. Vérifiez votre connexion internet et réessayez.</p>
    <button onclick="window.location.reload()">Réessayer</button>
  </div>
</body>
</html>
