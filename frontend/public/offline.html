<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaBulletin — Hors ligne</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f8fafc;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 1.5rem;
      color: #1f2937;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
    }
    .icon {
      width: 72px; height: 72px;
      background: #ffffff; border: 2px solid #e5e7eb;
      border-radius: 20px;
      margin: 0 auto 1.5rem;
      display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 1.35rem; font-weight: 800; margin-bottom: 0.5rem; }
    p  { font-size: 0.9rem; color: #6b7280; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: linear-gradient(135deg, #1E2A78, #3b4fd8);
      color: #fff; border: none; border-radius: 12px;
      padding: 0.75rem 2rem; font-size: 0.9rem; font-weight: 700;
      cursor: pointer; width: 100%;
      font-family: inherit;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="-7 0 38 38">
        <rect x="0.5" y="6" width="23" height="31.5" rx="2.6" fill="#0b2347"/>
        <rect x="2.6" y="8.6" width="18.8" height="24.6" fill="#fdc632"/>
        <polygon points="5,33.2 19.5,8.5 21.4,33.2" fill="#fdd657"/>
        <polygon points="4,33 15,1 18.8,5 20.4,31.6" fill="#efefef"/>
        <polygon points="2.6,33.6 15,0.4 15.6,27 5.2,33.6" fill="#f6a50a"/>
        <rect x="10.9" y="34.6" width="2.2" height="1.6" rx="0.4" fill="#d9d9d9"/>
      </svg>
    </div>
    <h1>Pas de connexion</h1>
    <p>Vous êtes hors ligne. Vérifiez votre connexion internet et réessayez.</p>
    <button onclick="window.location.reload()">Réessayer</button>
  </div>
</body>
</html>
