    <!-- 7. FAQPage — shown as rich snippets in Google results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Est-ce que je dois payer pour essayer NovaBulletin ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Non. Utilisez NovaBulletin pendant tout un trimestre complet. Si vous êtes satisfait à la fin du trimestre, vous payez. Sinon, vous revenez à votre ancien système. Aucun engagement, aucune carte bancaire requise dès le départ."
          }
        },
        {
          "@type": "Question",
          "name": "Comment NovaBulletin envoie-t-il les bulletins aux parents sur WhatsApp ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Une fois les notes saisies et les bulletins générés, l'admin clique sur 'Envoyer'. NovaBulletin envoie automatiquement le bulletin PDF personnalisé à chaque parent sur WhatsApp via l'API officielle WhatsApp Business. Si le parent n'a pas WhatsApp, le bulletin est envoyé par email ou peut être imprimé en PDF."
          }
        },
        {
          "@type": "Question",
          "name": "NovaBulletin fonctionne-t-il sur téléphone mobile ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui. NovaBulletin est une application web progressive (PWA) qui fonctionne sur ordinateur, tablette et smartphone Android/iOS. Les enseignants saisissent leurs notes directement depuis leur téléphone. Aucune installation requise — ouvrez simplement votre navigateur."
          }
        },
        {
          "@type": "Question",
          "name": "Combien de temps faut-il pour configurer l'école sur NovaBulletin ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Environ 30 minutes pour une école de taille moyenne. Vous pouvez importer vos élèves depuis un fichier Excel ou CSV en quelques clics. Notre équipe vous accompagne à chaque étape via WhatsApp."
          }
        },
        {
          "@type": "Question",
          "name": "NovaBulletin remplace-t-il tous les registres papier de l'école ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui. NovaBulletin centralise 11 registres : présences, santé, bibliothèque, inventaire, anciens élèves, transferts, dossiers disciplinaires, examens nationaux (CEPD, BEPC, BAC, BTS), calendrier, documents officiels et profils du personnel."
          }
        },
        {
          "@type": "Question",
          "name": "Les données des élèves sont-elles sécurisées dans NovaBulletin ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui. Toutes les données sont chiffrées et hébergées sur infrastructure cloud sécurisée. Chaque école n'a accès qu'à ses propres données. La conformité RGPD est assurée."
          }
        },
        {
          "@type": "Question",
          "name": "NovaBulletin est-il disponible au Togo, Bénin, Côte d'Ivoire et Sénégal ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui. NovaBulletin est conçu pour les écoles d'Afrique francophone. Il est actuellement utilisé au Togo, Bénin, Côte d'Ivoire, Sénégal, Ghana et Cameroun. L'interface est disponible en français et en anglais."
          }
        },
        {
          "@type": "Question",
          "name": "Qui a créé NovaBulletin ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "NovaBulletin a été créé par une équipe togolaise : Felix Atoma (Lead Developer), Manzaman Abalossosso (Project Manager) et Benjamin Ngbabou (Software Developer). L'équipe est basée à Lomé, Togo."
          }
        }
      ]
    }
